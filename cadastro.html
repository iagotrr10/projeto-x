<!DOCTYPE html>
<html lang="en">
<head>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wish a Drink — Cadrastro</title>
  <meta name="description" content="Depósito virtual de bebidas: cervejas, refrigerantes, sucos, energéticos, destilados e vinhos.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Poppins:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="  ">
</head>
<body>
    
    <h1>CADASTRO DE USUÁRIO</h1>

    <div class="">
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome" name="nome" required placeholder="Digite seu nome...">
                    </div>
                   
                    <div class="">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
                    </div>


                    <div class="">
                        <label for="nascimento">Data de Nascimento:</label>
                        <input type="date" id="nascimento" name="nascimento">
                    </div>

                    <div class="">
                        <label for="senha">Password:</label>
                        <input type="password" id="senha" name="senha" required minlength="14" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_])">
                        
                         
                    </div>


                    <div class="">
                        <label for="confirm-senha">Confirmar Senha:</label>
                        <input type="password" id="confirm-senha" name="confirm-senha" required minlength="14" placeholder="Digite a senha novamente">
                        <small class="error-msg" id="senha-error"></small>
                    </div>

</body>
</html>
